# This file contains all available configuration options for golangci-lint

version: "2"

# options for analysis running
run:
  # timeout for analysis, e.g. 30s, 5m, default is 0 (disabled) in v2
  timeout: 5m

  # exit code when at least one issue was found, default is 1
  issues-exit-code: 1

  # include test files or not, default is true
  tests: true

# output configuration options
output:
  # add a prefix to the output file references; default is no prefix
  path-prefix: ""
  formats:
    text:
      path: stdout

linters:
  # disable defaults and re-enable them explicitly
  default: none
  enable:
    # These are the defaults for golangci-lint
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Also enable these
    - goconst

  exclusions:
    # Enable default exclusion presets (replaces exclude-use-default: true)
    presets:
      - comments
      - std-error-handling
      - common-false-positives

    # Exclusion rules (moved from issues.exclude-rules)
    rules:
      # Exclude some linters from running on test files.
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec

      # Exclude known linters from partially hard-vendored code,
      # which is impossible to exclude via "nolint" comments.
      - path: internal/hmac/
        text: "weak cryptographic primitive"
        linters:
          - gosec

      # Exclude some staticcheck messages
      - linters:
          - staticcheck
        text: "SA9003:"

      # Exclude lll issues for long lines with go:generate
      - linters:
          - lll
        source: "^//go:generate "

    # Paths to exclude from linting (replaces skip-dirs-use-default + gen/ exclusion)
    paths:
      - gen/
      - third_party$
      - builtin$

  # Linter settings (moved from top-level linters-settings to linters.settings in v2)
  settings:
    errcheck:
      # report about not checking of errors in type assertions
      check-type-assertions: false
      # report about assignment of errors to blank identifier
      check-blank: false
    goconst:
      # minimal length of string constant, 3 by default
      min-len: 3
      # minimal occurrences count to trigger, 3 by default
      min-occurrences: 3
    govet:
      # settings per analyzer
      settings:
        printf:
          funcs:
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Infof
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Warnf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Errorf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Fatalf
      enable-all: true
      disable:
        - fieldalignment
    whitespace:
      multi-if: false
      multi-func: false

# Formatters section (gofmt and goimports moved here in v2)
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/org/project

issues:
  # Show only new issues: if there are unstaged changes or untracked files,
  # only those changes are analyzed, else only changes in HEAD~ are analyzed.
  new: false

severity:
  default: error
